services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flow_desk
      POSTGRES_PASSWORD: flow_desk_dev
      POSTGRES_DB: flow_desk
    ports:
      - "5432:5432"
    volumes:
      - flow_desk_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flow_desk_redis:/data

volumes:
  flow_desk_postgres:
  flow_desk_redis:
